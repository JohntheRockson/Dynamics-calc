[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attitude-sim"
version = "0.1.0"
description = "6DOF rigid-body attitude dynamics, control, and estimation simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dynamics-calc contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
attitude-sim = "attitude_sim.sim:main"
attitude-sim-mc = "attitude_sim.monte_carlo:main"

[project.urls]
Homepage = "https://github.com/JohntheRockson/Dynamics-calc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

# Lightweight lint gate. E501 is ignored so CI does not force a repo-wide wrap.
# E741 is ignored because principal inertia I is conventional in this code.
[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "E501",
    "E741",
    # Scientific comments/docstrings use minus, times, sigma, en-dash.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["attitude_sim"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "scipy.*"]
ignore_missing_imports = true

# Line coverage of the attitude_sim package. Measured 91% after #6/#7/#8
# (Python 3.12, pytest-cov). Floor is 80% so the GIF path in plots.py and
# a little new code can land without a coverage-only refactor. Raise
# later; do not lower without a note.
[tool.coverage.run]
source_pkgs = ["attitude_sim"]
branch = false
omit = ["*/attitude_sim/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
