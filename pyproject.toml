[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attitude-sim"
version = "0.1.0"
description = "6DOF rigid-body attitude dynamics, control, and estimation simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dynamics-calc contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
attitude-sim = "attitude_sim.sim:main"
attitude-sim-mc = "attitude_sim.monte_carlo:main"

[project.urls]
Homepage = "https://github.com/JohntheRockson/Dynamics-calc"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Real defects only: unused names, undefined names, pyupgrade, a few bugbears.
# E501 is left off so CI does not churn scientific comments / equations.
# E741: principal-moment `I` is conventional in this codebase.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B018"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["attitude_sim"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["attitude_sim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
