[package]
name = "attitude-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "6DOF rigid-body attitude dynamics, control, and estimation engine"

[dependencies]
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
thiserror = "1"

[dev-dependencies]
approx = "0.5"
serde_json = "1"
