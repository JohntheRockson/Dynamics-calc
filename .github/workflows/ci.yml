name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc -b
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build

  server-smoke:
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Build server (release)
        run: cargo build --release -p attitude-server
      - name: Smoke test the running server
        run: |
          PORT=8099 ./target/release/attitude-server &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8099/api/health && break
            sleep 0.5
          done
          curl -sf http://localhost:8099/api/health
          curl -sf http://localhost:8099/api/scenarios | grep -q '"slew"'
          curl -sf -X POST http://localhost:8099/api/simulate \
            -H 'Content-Type: application/json' \
            -d '{"scenario":"slew","estimator":"truth","t_final":2.0}' \
            | grep -q '"final_att_error_deg"'
          curl -sf http://localhost:8099/ | grep -qi '<title>'
          kill $SERVER_PID

  python-legacy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: legacy-python/pyproject.toml
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        if: matrix.python-version == '3.12'
        run: ruff check src tests
      - name: Mypy
        if: matrix.python-version == '3.12'
        run: mypy src
      - name: Run unit tests with coverage
        run: pytest -v --tb=short --cov=attitude_sim --cov-report=term-missing --cov-fail-under=80
      - name: CLI smoke (scenarios)
        run: |
          python -m attitude_sim --scenario slew --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario detumble --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario hold --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario eigenaxis --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario polhode --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --list-scenarios
      - name: Monte Carlo smoke
        run: |
          # MC default is slew; hold / eigenaxis / --env are opt-in (tiny N).
          python -m attitude_sim.monte_carlo --n 5 --estimator truth --t-final 0.2 --dt 0.05 --inertia-frac 0.0 --diverge-deg 180
          python -m attitude_sim.monte_carlo --n 3 --scenario eigenaxis --estimator truth --t-final 0.2 --dt 0.05 --inertia-frac 0.0 --diverge-deg 180
          python -m attitude_sim.monte_carlo --n 3 --scenario hold --estimator truth --t-final 0.2 --dt 0.05 --inertia-frac 0.0 --diverge-deg 180
          python -m attitude_sim.monte_carlo --n 3 --scenario slew --env --estimator truth --t-final 0.2 --dt 0.05 --inertia-frac 0.0 --diverge-deg 180
