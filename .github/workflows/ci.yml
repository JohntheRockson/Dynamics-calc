name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run unit tests with coverage
        # Floor is [tool.coverage.report] fail_under = 80 in pyproject.toml
        # (measured 91% after #6/#7/#8 on Python 3.12).
        run: pytest -v --tb=short --cov=attitude_sim --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage.xml
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: CLI smoke (scenarios + MC harness)
        run: |
          python -m attitude_sim --scenario slew --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario detumble --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario hold --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario eigenaxis --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --controller lqr --estimator mahony --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --controller pid --estimator truth --angle-deg 0 \
            --tau-dist 0.002,-0.001,0.0008 --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --controller pid --estimator truth \
            --actuator-tau-max 0.02 --actuator-tau 0.05 --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --controller pid --estimator truth \
            --gravity-gradient --residual-dipole --actuator-tau-max 0.008 \
            --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --list-scenarios
          # MC harness is slew-only; detumble/hold/eigenaxis are SimLab scenarios, not in the sweep.
          python -m attitude_sim.monte_carlo --n 5 --estimator truth --t-final 0.2 --dt 0.05 --inertia-frac 0.0 --diverge-deg 180

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel and import
        run: |
          python -m pip install dist/*.whl
          python -c "import attitude_sim; print(attitude_sim.__version__)"
