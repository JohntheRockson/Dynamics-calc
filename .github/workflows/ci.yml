name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  MPLBACKEND: Agg
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest -v --tb=short
      - name: CLI smoke (both scenarios + MC harness)
        run: |
          python -m attitude_sim --scenario slew --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim --scenario detumble --t-final 0.2 --no-plot --no-gif
          python -m attitude_sim.monte_carlo --n 5 --estimator truth --t-final 0.2 --dt 0.05 --inertia-frac 0.0
